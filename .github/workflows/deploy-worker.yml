name: Deploy Cloudflare Worker

on:
  push:
    branches: [claude/readme-permission-check-0sk12b]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Verify Cloudflare credentials are present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 또는 CLOUDFLARE_ACCOUNT_ID 리포지토리 시크릿이 비어 있습니다. Settings > Secrets and variables > Actions 에서 이름을 확인하세요."
            exit 1
          fi

      # D1 데이터베이스가 이미 있으면 그 id를 쓰고, 없으면 새로 만든다. wrangler.toml 의
      # 자리표시자 database_id 를 실제 id로 갈아끼운 뒤 이후 단계에서 그 파일을 그대로 쓴다.
      - name: Resolve D1 database id
        run: |
          set -e
          DB_NAME="relaymonsters-db"
          echo "기존 D1 데이터베이스 조회 중..."
          npx wrangler d1 list --json > d1-list.json || { echo "::error::wrangler d1 list 실패 — 토큰 권한(D1:Edit)을 확인하세요."; cat d1-list.json 2>/dev/null; exit 1; }
          DB_ID=$(node -e "
            const list = JSON.parse(require('fs').readFileSync('d1-list.json', 'utf8'));
            const found = list.find((d) => d.name === '$DB_NAME');
            console.log(found ? found.uuid : '');
          ")
          if [ -z "$DB_ID" ]; then
            echo "존재하지 않음 — 새로 생성합니다."
            # d1 create 는 --json 을 지원하지 않는다 (d1 list 와 다름). 텍스트 출력에서
            # `database_id = "..."` 줄을 그대로 파싱한다.
            npx wrangler d1 create "$DB_NAME" | tee d1-create.log || { echo "::error::wrangler d1 create 실패"; exit 1; }
            DB_ID=$(grep -oE 'database_id = "[a-f0-9-]+"' d1-create.log | grep -oE '[a-f0-9-]{36}')
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::D1 database id 를 확인하지 못했습니다."
            exit 1
          fi
          echo "DB_ID=$DB_ID"
          sed -i "s/database_id = \".*\"/database_id = \"$DB_ID\"/" wrangler.toml
          cat wrangler.toml

      - name: Apply schema (idempotent — CREATE TABLE IF NOT EXISTS)
        run: npx wrangler d1 execute relaymonsters-db --remote --file=schema.sql

      # D1(SQLite)은 ADD COLUMN IF NOT EXISTS 를 지원하지 않으므로, 이미 배포된 DB에
      # team_name 컬럼이 없을 때만 추가한다. "duplicate column" 오류는 이미 있다는 뜻이라 무시한다.
      - name: Add team_name column if missing (older deployed DBs)
        run: |
          OUT=$(npx wrangler d1 execute relaymonsters-db --remote --command="ALTER TABLE snapshots ADD COLUMN team_name TEXT" 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -qi "error" && ! echo "$OUT" | grep -qi "duplicate column"; then
            echo "::error::team_name 컬럼 추가 실패"
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler deploy | tee deploy.log

      - name: Report deployed URL
        id: report
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::배포 로그에서 URL을 찾지 못했습니다. deploy.log 를 확인하세요."
            exit 1
          fi
          echo "배포 완료: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### 배포 주소" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      # 이 러너는 실제 인터넷에 붙어 있으므로, 배포된 Worker 를 즉시 실제로 호출해
      # 헬스체크와 업로드→조회 라운드 트립까지 검증한다 (샌드박스 egress 정책으로는 못 함).
      - name: Smoke test the deployed Worker
        run: |
          set -e
          URL="${{ steps.report.outputs.url }}"
          echo "-- health --"
          curl -sf "$URL/health" | tee health.json
          echo
          echo "-- upload --"
          SNAP_ID="s_ci_smoke_$(date +%s)"
          curl -sf -X POST "$URL/api/snapshots" \
            -H "Content-Type: application/json" -H "X-Owner-Id: ci-smoke-test" \
            -d "{\"snapshotId\":\"$SNAP_ID\",\"round\":1,\"wins\":1,\"lives\":3,\"teamName\":\"CI 스모크팀\",\"ring\":[{\"speciesId\":\"T1-01\",\"exp\":1}]}" \
            | tee upload.json
          echo
          echo "-- fetch (다른 owner 로 조회, 방금 올린 스냅샷이 보여야 함) --"
          curl -sf "$URL/api/snapshots?round=1" -H "X-Owner-Id: someone-else" | tee fetch.json
          echo
          node -e "
            const fs = require('fs');
            const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
            if (!health.ok) throw new Error('health check failed: ' + JSON.stringify(health));
            const upload = JSON.parse(fs.readFileSync('upload.json', 'utf8'));
            if (!upload.ok) throw new Error('upload failed: ' + JSON.stringify(upload));
            const fetched = JSON.parse(fs.readFileSync('fetch.json', 'utf8'));
            const found = Array.isArray(fetched) && fetched.find((s) => s.snapshotId === '$SNAP_ID');
            if (!found) {
              throw new Error('업로드한 스냅샷을 조회 결과에서 찾지 못했습니다: ' + JSON.stringify(fetched));
            }
            if (found.teamName !== 'CI 스모크팀') {
              throw new Error('teamName 이 왕복되지 않았습니다: ' + JSON.stringify(found));
            }
            console.log('스모크 테스트 통과 — 업로드/조회 라운드 트립 확인됨 (teamName 포함)');
          "
          echo "### 스모크 테스트" >> "$GITHUB_STEP_SUMMARY"
          echo "헬스체크·업로드·조회 라운드 트립 통과" >> "$GITHUB_STEP_SUMMARY"
